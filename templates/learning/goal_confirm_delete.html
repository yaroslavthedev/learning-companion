{% extends "base.html" %}

{% block title %}Delete goal · Learning Companion{% endblock %}

{% block content %}
  <article>
    <h1>Delete goal</h1>
    <p>Delete <strong>{{ goal.title }}</strong>? This can't be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Delete</button>
      <a href="{% url 'goal-detail' goal.pk %}" role="button" class="secondary">Cancel</a>
    </form>
  </article>
{% endblock %}
