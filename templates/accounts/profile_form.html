{% extends "base.html" %}

{% block title %}Edit profile · Learning Companion{% endblock %}

{% block content %}
  <article>
    <h1>Edit profile</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Save</button>
      <a href="{% url 'profile' %}" role="button" class="secondary">Cancel</a>
    </form>
  </article>
{% endblock %}
