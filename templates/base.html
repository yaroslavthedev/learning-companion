<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Learning Companion{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><a href="{% url 'home' %}"><strong>Learning Companion</strong></a></li>
      </ul>
      <ul>
        {% if user.is_authenticated %}
          <li><a href="{% url 'goal-list' %}">Goals</a></li>
          <li><a href="{% url 'session-list' %}">Sessions</a></li>
          <li><a href="{% url 'profile' %}">Profile</a></li>
          <li>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="outline">Log out</button>
            </form>
          </li>
        {% else %}
          <li><a href="{% url 'login' %}">Log in</a></li>
          <li><a href="{% url 'signup' %}">Sign up</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
